# Override for isolated M3 smoke on port 1985.
# Host ports: ONLY 1985→app:1984 (!override). postgres/minio stay internal (no host publish).
# Never bind 1984 or any other host port from this override.
# Usage: docker compose -p at-m3 -f docker-compose.yml -f deploy/docker-compose.at-m3.yml up -d --build
# Tear down: docker compose -p at-m3 -f docker-compose.yml -f deploy/docker-compose.at-m3.yml down -v
services:
  postgres:
    container_name: at-m3-postgres
    mem_limit: 512m
  minio:
    container_name: at-m3-minio
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z@sha256:7bb2aff6b89efe1cb1303c10fc21d579447434ed06649ac9ec05a5e2dbf30ad7
    mem_limit: 256m
  app:
    container_name: at-m3-app
    image: agenttracer-at-m3:local
    build:
      context: .
      dockerfile: deploy/Dockerfile.prebuilt
    ports: !override
      - "1985:1984"
    mem_limit: 512m
    environment:
      GOMEMLIMIT: 400MiB
