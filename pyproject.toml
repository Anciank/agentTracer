[project]
name = "agent-tracer"
version = "0.1.0"
description = "A LangSmith-compatible tracing server with local-only storage"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
client = [
    "langsmith>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
langsmith-local = "langsmith_server.__main__:main"
langsmith-local-report = "langsmith_server.analysis:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["langsmith_server"]
