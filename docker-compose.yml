# Sized for ~1.9GB VPS: PG 128MB shared_buffers, S3-compat (silo/MinIO fork), app slim.
# Note: upstream minio/minio was removed from Docker Hub; pgsty/silo is S3/MINIO_* compatible.
services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    mem_limit: 512m
    environment:
      POSTGRES_USER: agenttracer
      POSTGRES_PASSWORD: agenttracer
      POSTGRES_DB: agenttracer
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=50
      - -c
      - effective_cache_size=256MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenttracer"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z@sha256:7bb2aff6b89efe1cb1303c10fc21d579447434ed06649ac9ec05a5e2dbf30ad7
    mem_limit: 256m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    restart: unless-stopped

  app:
    # Explicit local name — never pgsty/silo, postgres, or :latest — so build/rollback cannot retag third-party images.
    image: agenttracer-app:local
    build:
      context: .
      dockerfile: deploy/Dockerfile
    mem_limit: 384m
    ports:
      - "1984:1984"
    environment:
      AGENTTRACER_LISTEN: ":1984"
      GOMEMLIMIT: 300MiB
      AGENTTRACER_DATABASE_URL: postgres://agenttracer:agenttracer@postgres:5432/agenttracer?sslmode=disable
      AGENTTRACER_API_KEY_FILE: /run/secrets/api_key
      AGENTTRACER_S3_ENDPOINT: http://minio:9000
      AGENTTRACER_S3_BUCKET: agenttracer
      AGENTTRACER_S3_ACCESS_KEY: minioadmin
      AGENTTRACER_S3_SECRET_KEY: minioadmin
      AGENTTRACER_S3_PATH_STYLE: "true"
      AGENTTRACER_HOT_RETENTION_DAYS: "14"
      AGENTTRACER_COLD_RETENTION_DAYS: "180"
      # One-shot post-migrate backfill; leave unset/empty in steady state (see deploy --backfill-graph-cache).
      AGENTTRACER_BACKFILL_GRAPH_CACHE: ${AGENTTRACER_BACKFILL_GRAPH_CACHE:-}
      AGENTTRACER_BACKFILL_CHAT_PREVIEWS: ${AGENTTRACER_BACKFILL_CHAT_PREVIEWS:-}
    volumes:
      - ./secrets/api_key:/run/secrets/api_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
